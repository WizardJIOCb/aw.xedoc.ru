# Managed initial configuration for aw.xedoc.ru. Later releases preserve this file,
# including HTTPS changes made by certbot. No other virtual hosts are modified.
server {
    listen 80;
    listen [::]:80;
    server_name aw.xedoc.ru;

    client_max_body_size 16k;
    access_log /var/log/nginx/aw.xedoc.ru.access.log;
    error_log /var/log/nginx/aw.xedoc.ru.error.log;

    location = /ws {
        proxy_pass http://127.0.0.1:3188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location /assets/ {
        alias /var/www/aw.xedoc.ru/current/dist/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
